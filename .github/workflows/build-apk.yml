name: Build QuoteSpark Signed Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Signed Android Release APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PATH: ${{ github.workspace }}/ci-release.keystore
      STORE_PASSWORD: ci-release-password
      KEY_PASSWORD: ci-release-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate CI release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias upload \
            -keypass "$KEY_PASSWORD" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=CodeAlpha CI,O=CodeAlpha,C=IN"

      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --verbose "$APK"

      - name: Upload signed QuoteSpark APK
        uses: actions/upload-artifact@v4
        with:
          name: QuoteSpark-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
